# Bundle layer for @soffits/dsh-card-board: one Host row that serves the
# boards to the Web UI page. Set dataDir (default: card-board in the DSH
# home) and, for a DSH several people sign in to, people / peopleFile in a
# profile override of this row.
- insert:
    - id: card-board
      name: '@soffits/dsh-card-board'
